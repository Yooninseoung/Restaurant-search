<!DOCTYPE html>

<html lang="en" data-bs-theme="light" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <meta name="generator" content="Hugo 0.122.0">
    <title>모든 식당 보기</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
          crossorigin="anonymous">

    <style>


        .search-form {
            max-width: 700px; /* 폼 전체 너비 조정 */
            margin: auto;
            display: flex;
            justify-content: center; /* 가운데 정렬 */
            align-items: center;
        }

    </style>
</head>
<body>


<header data-bs-theme="dark">
    <div class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a href="/index" class="navbar-brand d-flex align-items-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor"
                     stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true" class="me-2"
                     viewBox="0 0 24 24">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
                <strong>GangwonCook</strong>
            </a>


            <div class="text-end">
                <div th:if="${session.userId != null}">
                    <span style="color:white;">환영합니다! <span th:text="${session.userId}"></span>님</span>
                    <button type="button" class="btn btn-outline-light me-2" onclick="location.href='/user/logout'">
                        Logout
                    </button>
                    <button type="button" class="btn btn-warning me-2" onclick="location.href='/restaurant/favorites'">
                        My 맛집
                    </button>
                </div>
                <div th:unless="${session.userId != null}">
                    <button type="button" class="btn btn-outline-light me-2" onclick="location.href='/user/login'">
                        Login
                    </button>
                    <button type="button" class="btn btn-warning" onclick="location.href='/user/signUp'">Sign-up
                    </button>
                </div>

            </div>
        </div>
    </div>
</header>


<main>
    <div class="container2 mt-3 bg-body-tertiary">
        <h1 style="text-align:center;">강원 원주 모든 식당!!</h1>

    </div>
    <div class="album py-5 ">
        <div class="container">

            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">

                <div th:each="item:${restaurant}">
                    <div class="col">
                        <div class="card shadow-sm">

                            <img class="bd-placeholder-img card-img-top" width="100%" height="225"
                                 th:src="@{/restaurant/RestaurantImg/{fileName}(fileName=${item.photoPath})}"
                                 alt="맛집 이미지"
                                 th:onclick="|location.href='@{/restaurant/detailScreen(restaurantId=${item.restaurantID})}'|">



                            <div class="card-body">
                                <p class="card-text" th:text="${item.restaurantName}">식당 이름</p>
                                <p><span th:text="${item.menu}">한식</span> | <span
                                        th:text="${item.address}">단계동 터미널</span></p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="btn-group">
                                        <button type="button" class="btn btn-sm btn-outline-secondary"
                                                th:onclick="|location.href='@{/restaurant/push/allPage/like(restaurantId=${item.restaurantID})}'|">
                                            좋아요👍
                                        </button>
                                        <button type="button" class="btn btn-sm btn-outline-secondary"
                                                th:onclick="|location.href='@{/restaurant/push/allPage/dislike(restaurantId=${item.restaurantID})}'|">
                                            싫어요👎
                                        </button>
                                    </div>
                                    <small class="text-body-secondary">즐겨찾기:<span th:text="${item.bookmarks}">13</span></small>
                                    <button type="button" class="btn btn-sm btn-outline-secondary"
                                            th:onclick="|location.href='@{/mark/allPage(restaurantId=${item.restaurantID})}'|">
                                        즐겨찾기⭐
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div><!--th:each-->


            </div>
        </div>
    </div>
    <div class="d-flex justify-content-center mt-2 my-3">
        <!-- 첫 페이지 버튼 -->
        <a th:href="@{/restaurant/restaurantAllPage(page=1)}" class="btn btn-outline-secondary"> << </a>

        <!-- 이전 10페이지 버튼 -->
        <a th:href="@{/restaurant/restaurantAllPage(page=${startPage - 10 < 1 ? 1 : startPage - 10})}"
           class="btn btn-outline-secondary mx-1" th:if="${startPage > 1}"> < </a>

        <!-- 페이지 번호 버튼 그룹 -->
        <div class="btn-group me-2 mx-2" role="group" aria-label="Page navigation">
        <span th:each="page: ${#numbers.sequence(startPage, endPage)}">
            <button type="button" class="btn btn-outline-secondary mx-1" th:if="${page == restaurant.number + 1}"
                    th:text="${page}" disabled></button>
            <a th:href="@{/restaurant/restaurantAllPage(page=${page})}">
                <button type="button" class="btn btn-outline-secondary mx-1"
                        th:unless="${page == restaurant.number + 1}" th:text="${page}"></button>
            </a>
        </span>
        </div>

        <!-- 다음 10페이지 버튼 -->
        <a th:href="@{/restaurant/restaurantAllPage(page=${endPage + 1 > restaurant.totalPages ? restaurant.totalPages : endPage + 1})}"
           class="btn btn-outline-secondary mx-1" th:if="${endPage < restaurant.totalPages}"> > </a>


        <!-- 마지막 페이지 버튼 -->
        <a th:href="@{/restaurant/restaurantAllPage(page=${restaurant.totalPages})}" class="btn btn-outline-secondary">
            >> </a>
    </div>
</main>


<footer style="background-color: #f8f9fa; padding: 20px; text-align: center; position: relative; transform: translateY(0%);">
    <p>식당 등록과 문의사항 : isyoon2000@naver.com</p>
    <p>백엔드 개발자 : 윤인성, 김민수</p>
    <p class="mb-0">
        <a href="#">Back to top</a>
    </p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>


</body>
</html>
