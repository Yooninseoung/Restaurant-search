<script>
    function validateReviewForm() {
    const oneLineReview = document.getElementById("OneLineReview").value.trim();
    const rating = parseFloat(document.getElementById("rating").value);
    const oneLineError = document.getElementById("oneLineError");
    const ratingError = document.getElementById("ratingError");

    let isValid = true;

    // 한줄평 검사: 최소 3자 이상
    if (oneLineReview.length < 3) {
        oneLineError.textContent = "한줄평은 최소 3자 이상이어야 합니다.";
        isValid = false;
    } else {
        oneLineError.textContent = "";
    }

    // 평점 검사: 0.0 ~ 9.9 범위 확인
    if (isNaN(rating) || rating < 0.1 || rating > 9.9) {
        ratingError.textContent = "평점은 0.1에서 9.9 사이의 값을 입력하세요.";
        isValid = false;
    } else {
        ratingError.textContent = "";
    }

    return isValid; // 모든 조건 만족 시 true 반환
}

</script>>

<script>

    document.getElementById("fileInput").addEventListener("change", function (event) {
        // 업로드된 파일 가져오기
        const file = event.target.files[0];
        if (file) {
            const fileName = file.name;

            // 한글 포함 여부 확인 (정규 표현식 사용)
            const containsKorean = /[가-힣]/.test(fileName);

            // 경고 표시 및 처리
            const warning = document.getElementById("fileWarning");
            if (containsKorean) {
                warning.style.display = "block"; // 경고 메시지 표시
                event.target.value = ""; // 파일 입력 초기화
            } else {
                warning.style.display = "none"; // 경고 메시지 숨김
            }
        }
    });
</script>
